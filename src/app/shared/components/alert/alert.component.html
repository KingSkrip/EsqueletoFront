
@if (!dismissed) {
    <div
        class="alert"
        [class.alert-border]="appearance === 'border'"
        [class.alert-fill]="appearance === 'fill'"
        [class.alert-outline]="appearance === 'outline'"
        [class.alert-soft]="appearance === 'soft'"
        [class.alert-primary]="type === 'primary'"
        [class.alert-accent]="type === 'accent'"
        [class.alert-basic]="type === 'basic'"
        [class.alert-info]="type === 'info'"
        [class.alert-success]="type === 'success'"
        [class.alert-warning]="type === 'warning'"
        [class.alert-error]="type === 'error'"
        role="alert"
    >
        @if (showIcon) {
            <div class="alert-icon">
                @switch (icon) {
                    @case ('check-circle') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <path d="m9 11 3 3L22 4"/>
                        </svg>
                    }
                    @case ('info') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4"/>
                            <path d="M12 8h.01"/>
                        </svg>
                    }
                    @case ('alert-triangle') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m10.29 3.86-8.1 14.03A2 2 0 0 0 3.92 21h16.16a2 2 0 0 0 1.73-3.11l-8.1-14.03a2 2 0 0 0-3.42 0Z"/>
                            <path d="M12 9v4"/>
                            <path d="M12 17h.01"/>
                        </svg>
                    }
                    @case ('x-circle') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="m15 9-6 6"/>
                            <path d="m9 9 6 6"/>
                        </svg>
                    }
                }
            </div>
        }

        <div class="alert-content">
            @if (title) {
                <div class="alert-title">{{ title }}</div>
            }

            @if (message) {
                <div class="alert-message">{{ message }}</div>
            }

            <ng-content></ng-content>
        </div>

        @if (dismissible) {
            <button
                type="button"
                class="alert-close"
                aria-label="Cerrar alerta"
                (click)="dismiss()"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m18 6-12 12"/>
                    <path d="m6 6 12 12"/>
                </svg>
            </button>
        }
    </div>
}

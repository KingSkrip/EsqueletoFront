<!-- Botón engrane -->
<button
    type="button"
    class="settings-cog fixed right-0 z-[90] flex h-10 w-10 cursor-pointer items-center justify-center rounded-l-lg bg-red-600/90 shadow-lg print:hidden"
    style="top: 275px"
    aria-label="Ajustes"
    (click)="toggleDrawer()"
>
    <mat-icon
        class="animate-spin-slow size-5 text-white"
        [svgIcon]="'heroicons_outline:cog-8-tooth'"
    ></mat-icon>
</button>

<!-- Drawer -->
@if (opened) {
    <div class="fixed inset-0 z-[998] bg-black/40" (click)="closeDrawer()"></div>

    <aside
        class="bg-card fixed top-0 right-0 bottom-0 z-[999] flex w-screen flex-col overflow-auto shadow-2xl sm:w-[25rem]"
    >
        <!-- Header -->
        <div class="bg-primary flex h-20 min-h-20 flex-row items-center px-6 text-white">
            <mat-icon class="size-7 text-current" [svgIcon]="'heroicons_outline:cog-8-tooth'"></mat-icon>
            <div class="ml-3 text-2xl font-semibold tracking-tight">Ajustes</div>
            <button class="ml-auto" mat-icon-button (click)="closeDrawer()">
                <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
            </button>
        </div>

        <div class="flex flex-col p-6">
            <!-- Theme -->
            @if (config.themes.length) {
                <div class="text-secondary text-md font-semibold">TEMA</div>
                <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3">
                    @for (t of config.themes; track t.id) {
                        <div
                            class="bg-hover ring-primary flex cursor-pointer items-center justify-center rounded-full px-4 py-3 ring-inset"
                            [class.ring-2]="config.theme === t.id"
                            [ngClass]="t.id"
                            (click)="setTheme(t.id)"
                        >
                            <div class="bg-primary h-3 w-3 flex-none rounded-full"></div>
                            <div
                                class="ml-2.5 truncate leading-5 font-medium"
                                [class.text-secondary]="config.theme !== t.id"
                            >
                                {{ t.name }}
                            </div>
                        </div>
                    }
                </div>

                <hr class="my-8" />
            }

            <!-- Scheme -->
            <div class="text-secondary text-md font-semibold">ESQUEMA</div>
            <div class="mt-6 grid grid-cols-3 justify-items-start gap-3">
                <!-- Auto -->
                <div
                    class="bg-hover ring-primary flex cursor-pointer items-center rounded-full py-3 pr-6 pl-5 ring-inset"
                    [class.ring-2]="config.scheme === 'auto'"
                    matTooltip="Usa el esquema de color del sistema operativo (prefers-color-scheme)."
                    (click)="setScheme('auto')"
                >
                    <mat-icon class="size-5" [svgIcon]="'heroicons_outline:bolt'"></mat-icon>
                    <div class="ml-2 font-medium leading-5" [class.text-secondary]="config.scheme !== 'auto'">
                        Auto
                    </div>
                </div>

                <!-- Dark -->
                <div
                    class="bg-hover ring-primary flex cursor-pointer items-center rounded-full py-3 pr-6 pl-5 ring-inset"
                    [class.ring-2]="config.scheme === 'dark'"
                    (click)="setScheme('dark')"
                >
                    <mat-icon class="size-5" [svgIcon]="'heroicons_outline:moon'"></mat-icon>
                    <div class="ml-2 font-medium leading-5" [class.text-secondary]="config.scheme !== 'dark'">
                        Oscuro
                    </div>
                </div>

                <!-- Light -->
                <div
                    class="bg-hover ring-primary flex cursor-pointer items-center rounded-full py-3 pr-6 pl-5 ring-inset"
                    [class.ring-2]="config.scheme === 'light'"
                    (click)="setScheme('light')"
                >
                    <mat-icon class="size-5" [svgIcon]="'heroicons_outline:sun'"></mat-icon>
                    <div class="ml-2 font-medium leading-5" [class.text-secondary]="config.scheme !== 'light'">
                        Claro
                    </div>
                </div>
            </div>

            <hr class="my-8" />

            <!-- Layout -->
            <div class="text-secondary text-md font-semibold">LAYOUT</div>
            <div class="mt-6 grid grid-cols-3 gap-3">
                <!-- Empty -->
                <div class="flex cursor-pointer flex-col" (click)="setLayout('empty')">
                    <div
                        class="flex h-20 flex-col overflow-hidden rounded-md border-2 hover:opacity-80"
                        [class.border-primary]="config.layout === 'empty'"
                    >
                        <div class="flex flex-auto flex-col bg-gray-50 dark:bg-gray-900"></div>
                    </div>
                    <div
                        class="text-secondary text-md mt-2 text-center font-medium"
                        [class.text-primary]="config.layout === 'empty'"
                    >
                        Empty
                    </div>
                </div>

                <!-- Thin -->
                <div class="flex cursor-pointer flex-col" (click)="setLayout('thin')">
                    <div
                        class="flex h-20 overflow-hidden rounded-md border-2 hover:opacity-80"
                        [class.border-primary]="config.layout === 'thin'"
                    >
                        <div class="w-3 bg-gray-100 dark:bg-gray-800">
                            <div class="mx-auto mt-2 h-1.5 w-1.5 rounded-sm bg-gray-300 dark:bg-gray-700"></div>
                            <div class="mt-2 flex w-full flex-col items-center space-y-1">
                                @for (i of [1, 2, 3, 4, 5]; track i) {
                                    <div class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-700"></div>
                                }
                            </div>
                        </div>
                        <div class="flex flex-auto flex-col border-l">
                            <div class="h-3 bg-gray-100 dark:bg-gray-800">
                                <div class="mr-1.5 flex h-full items-center justify-end">
                                    @for (i of [1, 2, 3]; track i) {
                                        <div class="ml-1 h-1 w-1 rounded-full bg-gray-300 dark:bg-gray-700"></div>
                                    }
                                </div>
                            </div>
                            <div class="flex flex-auto border-t bg-gray-50 dark:bg-gray-900"></div>
                        </div>
                    </div>
                    <div
                        class="text-secondary text-md mt-2 text-center font-medium"
                        [class.text-primary]="config.layout === 'thin'"
                    >
                        Thin
                    </div>
                </div>

                <!-- Modern -->
                <div class="flex cursor-pointer flex-col" (click)="setLayout('modern')">
                    <div
                        class="flex h-20 flex-col overflow-hidden rounded-md border-2 hover:opacity-80"
                        [class.border-primary]="config.layout === 'modern'"
                    >
                        <div class="flex h-4 items-center border-b bg-gray-100 px-2 dark:bg-gray-800">
                            <div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700"></div>
                            <div class="ml-2 flex h-3 items-center space-x-1">
                                @for (i of [1, 2, 3]; track i) {
                                    <div class="h-1 w-3 rounded-full bg-gray-300 dark:bg-gray-700"></div>
                                }
                            </div>
                            <div class="ml-auto flex items-center justify-end space-x-1">
                                <div class="h-1 w-1 rounded-full bg-gray-300 dark:bg-gray-700"></div>
                                <div class="h-1 w-1 rounded-full bg-gray-300 dark:bg-gray-700"></div>
                            </div>
                        </div>
                        <div class="flex flex-auto flex-col">
                            <div class="flex flex-auto bg-gray-50 dark:bg-gray-900"></div>
                        </div>
                    </div>
                    <div
                        class="text-secondary text-md mt-2 text-center font-medium"
                        [class.text-primary]="config.layout === 'modern'"
                    >
                        Modern
                    </div>
                </div>
            </div>
        </div>
    </aside>
}
